    <!-- Lightbox: a native <dialog> for built-in focus management and
         Escape-to-close. Populated by js/main.js when a thumbnail is
         activated; without JavaScript the links open the image directly. -->
    <dialog id="lightbox" class="lightbox" aria-label="Image viewer">
      <button class="lightbox__close" type="button">
        <span class="visually-hidden">Close image viewer</span>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path
            d="M4 4 L16 16 M16 4 L4 16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <figure class="lightbox__figure">
        <!-- Transparent 1x1 placeholder; js/main.js swaps in the chosen image. -->
        <img
          class="lightbox__image"
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
          alt=""
        >
        <figcaption class="lightbox__caption"></figcaption>
      </figure>
    </dialog>
