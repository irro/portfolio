<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC 8 Ball — Admin</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

  <!-- Login -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <div class="login-brand"><span class="ball8">8</span> NYC 8 Ball Admin</div>
      <label for="password">Admin password</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <button type="submit">Sign in</button>
      <p class="login-error" id="loginError" hidden></p>
    </form>
  </section>

  <!-- Dashboard -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand"><a href="/" class="ball8" title="View site">8</a> <span>Responses</span></div>
      <div class="topbar-actions">
        <span class="counts" id="counts"></span>
        <button class="btn ghost" id="addBtn">+ Add response</button>
        <button class="btn ghost" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title, category, borough…" />
      <select id="filterActive">
        <option value="all">All statuses</option>
        <option value="active">Active only</option>
        <option value="inactive">Inactive only</option>
      </select>
      <select id="sortBy">
        <option value="manual">Sort: Custom order</option>
        <option value="title">Sort: Title (A–Z)</option>
        <option value="cost">Sort: Cost (low→high)</option>
        <option value="cost-desc">Sort: Cost (high→low)</option>
        <option value="category">Sort: Category</option>
        <option value="borough">Sort: Borough</option>
      </select>
      <span class="hint" id="reorderHint">Use ↑ ↓ to reorder (custom order only)</span>
    </div>

    <div class="table-wrap">
      <table class="grid" id="grid">
        <thead>
          <tr>
            <th class="col-order">Order</th>
            <th>Title</th>
            <th class="col-cat">Category</th>
            <th class="col-boro">Borough</th>
            <th class="col-cost">Cost</th>
            <th class="col-active">Active</th>
            <th class="col-act">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden>No responses match your filters.</p>
    </div>
  </div>

  <!-- Edit / Add modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <h2 id="modalTitle">Edit response</h2>
      <form id="editForm">
        <input type="hidden" id="f_id" />
        <div class="field">
          <label for="f_title">Title *</label>
          <input id="f_title" required maxlength="120" />
        </div>
        <div class="field">
          <label for="f_description">Description</label>
          <textarea id="f_description" rows="3" maxlength="600"></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f_category">Category</label>
            <input id="f_category" list="categories" />
          </div>
          <div class="field">
            <label for="f_borough">Borough</label>
            <input id="f_borough" list="boroughs" />
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f_cost">Cost per person ($, 0 = free, max 50)</label>
            <input id="f_cost" type="number" min="0" max="50" step="0.01" />
          </div>
          <div class="field">
            <label for="f_costNote">Cost note</label>
            <input id="f_costNote" maxlength="120" placeholder="e.g. Pay what you wish" />
          </div>
        </div>
        <div class="field">
          <label for="f_url">Info URL</label>
          <input id="f_url" type="url" placeholder="https://…" />
        </div>
        <label class="check"><input type="checkbox" id="f_active" /> Active (can appear in the 8 ball)</label>
        <p class="form-error" id="formError" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <datalist id="categories"></datalist>
  <datalist id="boroughs"></datalist>

  <script src="/js/admin.js"></script>
</body>
</html>
